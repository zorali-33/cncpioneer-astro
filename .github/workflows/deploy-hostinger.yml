name: Deploy to Hostinger

on:
  workflow_run:
    workflows:
      - Verify production build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://cncpioneer.com/

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_FTP_PORT: "21"
      HOSTINGER_FTP_PATH: "."

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and run release audits
        run: npm run release:verify

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is empty or has not been configured."
              exit 1
            fi
          done

      - name: Install FTP transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp zip

      - name: Check FTP connection and deployment folder
        shell: bash
        run: |
          set -uo pipefail
          set +e
          diagnostics=$(lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; pwd; cls -la; bye" 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -Eqi 'login failed|530|authentication' <<< "$diagnostics"; then
              title='FTP authentication rejected'
            else
              title='FTP preflight failed'
            fi

            message=$(printf '%s' "$diagnostics" | tail -n 8 | tr '\r\n' ' ')
            message=${message//'%'/'%25'}
            echo "::error title=$title::$message"
            exit "$status"
          fi

          printf '%s\n' "$diagnostics"

      - name: Locate the live WordPress document root
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "."
            "public_html"
            "domains/cncpioneer.com/public_html"
          )

          for candidate in "${candidates[@]}"; do
            if lftp \
              -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
              -p "$HOSTINGER_FTP_PORT" \
              "$HOSTINGER_HOST" \
              -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; cd \"$candidate\"; cls -1 wp-config.php; bye" \
              >/dev/null 2>&1; then
              echo "REMOTE_DEPLOY_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using the live document root: $candidate"
              exit 0
            fi
          done

          listing=$(lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; cls -1; bye" \
            2>&1 | head -n 40 | tr '\r\n' ' ')
          listing=${listing//'%'/'%25'}
          echo "::error title=Live document root not found::FTP root contains: $listing"
          exit 1

      - name: Package the verified site
        shell: bash
        run: |
          set -euo pipefail
          archive_file="$RUNNER_TEMP/cncpioneer-astro.zip"
          deployer_file="$RUNNER_TEMP/cncpioneer-deploy.php"
          deploy_token=$(openssl rand -hex 32)
          echo "::add-mask::$deploy_token"
          echo "DEPLOY_TOKEN=$deploy_token" >> "$GITHUB_ENV"
          echo "DEPLOY_ARCHIVE=$archive_file" >> "$GITHUB_ENV"
          echo "DEPLOY_SCRIPT=$deployer_file" >> "$GITHUB_ENV"

          (cd dist && zip -q -r "$archive_file" .)

          cat > "$deployer_file" <<'PHP'
          <?php
          declare(strict_types=1);
          set_time_limit(0);
          ignore_user_abort(true);

          $expectedToken = '__DEPLOY_TOKEN__';
          $providedToken = $_SERVER['HTTP_X_DEPLOY_TOKEN'] ?? '';
          if (!hash_equals($expectedToken, $providedToken)) {
              http_response_code(403);
              exit('FORBIDDEN');
          }

          if (!class_exists('ZipArchive')) {
              http_response_code(500);
              exit('ZIP_EXTENSION_MISSING');
          }

          $root = __DIR__;
          $archive = $root . '/.cncpioneer-deploy.zip';
          if (!is_file($archive)) {
              http_response_code(500);
              exit('ARCHIVE_MISSING');
          }

          $zip = new ZipArchive();
          if ($zip->open($archive) !== true) {
              http_response_code(500);
              exit('ARCHIVE_INVALID');
          }

          for ($index = 0; $index < $zip->numFiles; $index++) {
              $name = $zip->getNameIndex($index);
              if ($name === false || str_starts_with($name, '/') || preg_match('~(^|/)\.\.(/|$)~', $name)) {
                  $zip->close();
                  http_response_code(500);
                  exit('ARCHIVE_PATH_INVALID');
              }
          }

          function removePath(string $path): void
          {
              if (is_link($path) || is_file($path)) {
                  if (!unlink($path)) {
                      throw new RuntimeException('Unable to remove file');
                  }
                  return;
              }

              if (is_dir($path)) {
                  $entries = new FilesystemIterator($path, FilesystemIterator::SKIP_DOTS);
                  foreach ($entries as $entry) {
                      removePath($entry->getPathname());
                  }
                  if (!rmdir($path)) {
                      throw new RuntimeException('Unable to remove directory');
                  }
              }
          }

          $preserve = [
              '.well-known',
              '.deployment-backups',
              '.cncpioneer-mail.php',
              '.cncpioneer-deploy.zip',
              'cncpioneer-deploy.php',
          ];

          try {
              foreach (new FilesystemIterator($root, FilesystemIterator::SKIP_DOTS) as $entry) {
                  if (!in_array($entry->getFilename(), $preserve, true)) {
                      removePath($entry->getPathname());
                  }
              }

              if (!$zip->extractTo($root)) {
                  throw new RuntimeException('Unable to extract archive');
              }
              $zip->close();
              @unlink($archive);
              @unlink(__FILE__);
              echo 'DEPLOY_OK';
          } catch (Throwable $error) {
              $zip->close();
              http_response_code(500);
              echo 'DEPLOY_FAILED: ' . $error->getMessage();
          }
          PHP

          sed -i "s/__DEPLOY_TOKEN__/$deploy_token/" "$deployer_file"

      - name: Upload the Astro deployment package
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 60; cd \"$REMOTE_DEPLOY_PATH\"; put \"$DEPLOY_ARCHIVE\" -o .cncpioneer-deploy.zip; put \"$DEPLOY_SCRIPT\" -o cncpioneer-deploy.php; bye"

      - name: Replace WordPress with Astro
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_status=$(curl \
            --silent \
            --show-error \
            --max-time 300 \
            --request POST \
            --header "X-Deploy-Token: $DEPLOY_TOKEN" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            https://cncpioneer.com/cncpioneer-deploy.php)
          result=$(cat "$response_file")

          if [ "$http_status" != '200' ] || [ "$result" != 'DEPLOY_OK' ]; then
            message=${result//$'\r'/ }
            message=${message//$'\n'/ }
            echo "::error title=Hostinger extraction failed::HTTP $http_status: $message"
            exit 1
          fi

      - name: Verify the deployed site
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; cls -l index.html; bye"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --output /dev/null \
            https://cncpioneer.com/
