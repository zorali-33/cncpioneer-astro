name: Deploy to Hostinger

on:
  workflow_run:
    workflows:
      - Verify production build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://cncpioneer.com/

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_FTP_PORT: "21"

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and run release audits
        run: npm run release:verify

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_REMOTE_PATH HOSTINGER_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is empty or has not been configured."
              exit 1
            fi
          done

          if ! [[ "$HOSTINGER_REMOTE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$HOSTINGER_REMOTE_PATH" == /* ]] ||
             [[ "$HOSTINGER_REMOTE_PATH" == *..* ]] ||
             [[ "$HOSTINGER_REMOTE_PATH" == "." ]]; then
            echo "::error title=Unsafe deployment path::HOSTINGER_REMOTE_PATH must be a relative folder such as public_html."
            exit 1
          fi

      - name: Install FTP transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Check FTP connection and deployment folder
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; cls -ld \"$HOSTINGER_REMOTE_PATH\"; bye"

      - name: Back up the current production site
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date -u +'%Y%m%dT%H%M%SZ')
          short_sha=${GITHUB_SHA:0:7}
          backup_name="cncpioneer-wordpress-before-$stamp-$short_sha.tar.gz"
          backup_dir="$RUNNER_TEMP/cncpioneer-wordpress-backup"
          backup_file="$RUNNER_TEMP/$backup_name"
          mkdir -p "$backup_dir"

          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mirror --parallel=4 \"$HOSTINGER_REMOTE_PATH\" \"$backup_dir\"; bye"

          tar -czf "$backup_file" -C "$backup_dir" .

          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mkdir -p deployment-backups; put \"$backup_file\" -o \"deployment-backups/$backup_name\"; bye"

      - name: Upload the verified site
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mirror --reverse --delete --parallel=4 --exclude-glob .well-known/** --exclude-glob .cncpioneer-mail.php dist/ \"$HOSTINGER_REMOTE_PATH\"; bye"

      - name: Verify the deployed site
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; cls -l \"$HOSTINGER_REMOTE_PATH/index.html\"; bye"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --output /dev/null \
            https://cncpioneer.com/
