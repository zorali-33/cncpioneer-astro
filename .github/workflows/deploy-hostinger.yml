name: Deploy to Hostinger

on:
  workflow_run:
    workflows:
      - Verify production build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://cncpioneer.com/

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_FTP_PORT: "21"
      HOSTINGER_FTP_PATH: "."

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and run release audits
        run: npm run release:verify

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is empty or has not been configured."
              exit 1
            fi
          done

      - name: Install FTP transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Check FTP connection and deployment folder
        shell: bash
        run: |
          set -uo pipefail
          set +e
          diagnostics=$(lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; pwd; cls -la; bye" 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -Eqi 'login failed|530|authentication' <<< "$diagnostics"; then
              title='FTP authentication rejected'
            else
              title='FTP preflight failed'
            fi

            message=$(printf '%s' "$diagnostics" | tail -n 8 | tr '\r\n' ' ')
            message=${message//'%'/'%25'}
            echo "::error title=$title::$message"
            exit "$status"
          fi

          printf '%s\n' "$diagnostics"

      - name: Back up the current production site
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date -u +'%Y%m%dT%H%M%SZ')
          short_sha=${GITHUB_SHA:0:7}
          backup_name="cncpioneer-wordpress-before-$stamp-$short_sha.tar.gz.enc"
          backup_dir="$RUNNER_TEMP/cncpioneer-wordpress-backup"
          archive_file="$RUNNER_TEMP/cncpioneer-wordpress-backup.tar.gz"
          backup_file="$RUNNER_TEMP/$backup_name"
          deny_file="$RUNNER_TEMP/deployment-backups.htaccess"
          mkdir -p "$backup_dir"

          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mirror --parallel=4 --exclude-glob .deployment-backups/** \"$HOSTINGER_FTP_PATH\" \"$backup_dir\"; bye"

          tar -czf "$archive_file" -C "$backup_dir" .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$archive_file" \
            -out "$backup_file" \
            -pass env:HOSTINGER_PASSWORD
          printf 'Require all denied\n' > "$deny_file"

          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mkdir -p .deployment-backups; put \"$deny_file\" -o .deployment-backups/.htaccess; put \"$backup_file\" -o \".deployment-backups/$backup_name\"; bye"

      - name: Upload the verified site
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mirror --reverse --delete --parallel=4 --exclude-glob .well-known/** --exclude-glob .deployment-backups/** --exclude-glob .cncpioneer-mail.php dist/ \"$HOSTINGER_FTP_PATH\"; bye"

      - name: Verify the deployed site
        shell: bash
        run: |
          set -euo pipefail
          lftp \
            -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" \
            -p "$HOSTINGER_FTP_PORT" \
            "$HOSTINGER_HOST" \
            -e "set cmd:fail-exit true; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; cls -l index.html; bye"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --output /dev/null \
            https://cncpioneer.com/
