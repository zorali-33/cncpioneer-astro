name: Verify production build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Production build failed::$line"
            done < <(tail -n 30 build.log)
          fi
          exit "$status"

      - name: Verify Apache canonical URLs and permanent moves
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes apache2
          node scripts/apache-routing-smoke.mjs

      - name: Run release acceptance audit
        shell: bash
        run: |
          set +e
          npm run audit:acceptance 2>&1 | tee acceptance.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if [ -f seo-migration/reports/parts-navigation.json ]; then
              node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("seo-migration/reports/parts-navigation.json","utf8"));for(const e of (r.errors||[]).slice(0,9)){const m=JSON.stringify(e).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Parts navigation audit::${m}`)}'
            fi
            diagnostics=$(grep -E '^FAIL ' acceptance.log | head -n 1 || true)
            if [ -z "$diagnostics" ]; then
              diagnostics=$(tail -n 1 acceptance.log)
            fi
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Release acceptance failed::$line"
            done <<< "$diagnostics"
          fi
          exit "$status"

      - name: Generate deployment manifest
        run: npm run manifest:dist
